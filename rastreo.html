<h1>Rastrear pedido</h1>
<p class="nota">Ingresa el folio de tu compra (ej. ST-12345) y el correo con el que compraste.</p>
<form id="track-form" class="tot" style="display:grid;gap:10px;max-width:480px">
<div class="form-group"><label for="t-folio">Folio</label><input id="t-folio" required placeholder="ST-00000" autocomplete="off" style="width:100%;padding:10px 12px;border:1px solid var(--borde);border-radius:8px"></div>
<div class="form-group"><label for="t-email">Correo</label><input id="t-email" type="email" required placeholder="tu@correo.com" autocomplete="email" style="width:100%;padding:10px 12px;border:1px solid var(--borde);border-radius:8px"></div>
<button class="btn add" type="submit">Consultar</button>
</form>
<div id="track-out" style="margin:18px 0;max-width:640px"></div>
<p><a class="btn ver" href="index.html">Volver a la tienda</a> <a class="btn ver" href="https://wa.me/523310642354?text=Hola%20Santillana%2C%20quiero%20ayuda%20con%20mi%20pedido" target="_blank" rel="noopener">Ayuda por WhatsApp</a></p></main>

<script>
(function () {
  /* Si se llega desde la confirmación de compra (?folio=&email=), prellenar los campos. */
  try {
    const u = new URL(location.href);
    const f = (u.searchParams.get('folio') || '').trim().toUpperCase();
    const e = (u.searchParams.get('email') || '').trim().toLowerCase();
    if (f) document.getElementById('t-folio').value = f;
    if (e) document.getElementById('t-email').value = e;
  } catch {}
})();
document.getElementById('track-form').addEventListener('submit', async e => {
  e.preventDefault();
  const out = document.getElementById('track-out');
  out.innerHTML = '<p class="nota">Consultando...</p>';
  try {
    const r = await fetch('api/track.php', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folio: document.getElementById('t-folio').value.trim().toUpperCase(), email: document.getElementById('t-email').value.trim().toLowerCase() }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'error');
    out.innerHTML = '<div class="tot"><div class="order-row"><span>Folio:</span><strong>' + j.folio + '</strong></div>'
      + '<div class="order-row"><span>Estado:</span><strong>' + j.estado_txt + '</strong></div>'
      + '<div class="order-row"><span>Total:</span><strong>$' + Number(j.total).toLocaleString('es-MX', { minimumFractionDigits: 2 }) + '</strong></div>'
      + '<div class="order-row"><span>Fecha:</span><span>' + (j.created_at || '') + '</span></div>'
      + j.items.map(it => '<div class="order-item-line"><span>' + it.nombre + ' x ' + it.qty + '</span></div>').join('') + '</div>';
  } catch (err) {
    out.innerHTML = '<div class="empty"><b>No encontrado</b><span>Verifica folio y correo.</span></div>';
  }
});
/* Auto-consulta cuando viene con folio+email en la URL (después de registrar el listener). */
try {
  const u2 = new URL(location.href);
  if ((u2.searchParams.get('folio') || '').trim() && (u2.searchParams.get('email') || '').trim()) {
    document.getElementById('track-form').requestSubmit();
  }
} catch {}

</script>
